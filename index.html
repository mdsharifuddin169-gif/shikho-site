<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>শিখো — SSC পড়াশোনার সাথী</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FBF8F0;--ink:#1E2E1B;--teal:#2F6E3F;--teal-deep:#1B4325;--line:#E1DBC4;--card:#FFFFFF;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Hind Siliguri',sans-serif;background:var(--paper);color:var(--ink);}
  .shell{max-width:680px;margin:0 auto;padding:20px 16px 40px;}
  h2{color:var(--teal-deep);margin:0 0 14px;font-size:22px;}
  .setup{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;}
  .rowsel{display:flex;gap:10px;}
  .rowsel select{flex:1;padding:10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;background:var(--card);color:var(--ink);}
  .chat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-height:220px;display:flex;flex-direction:column;gap:12px;margin-top:14px;}
  .bubble{max-width:88%;padding:11px 14px;border-radius:12px;line-height:1.6;font-size:15px;white-space:pre-wrap;}
  .bubble.user{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:3px;}
  .bubble.ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:3px;}
  .bubble.ai.loading{opacity:.6;font-style:italic;}
  .composer{display:flex;gap:8px;margin-top:12px;}
  .composer input{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:15px;}
  .composer button{padding:0 20px;border:none;border-radius:10px;background:var(--teal);color:#fff;font-family:inherit;font-weight:600;font-size:14.5px;cursor:pointer;}
</style>
</head>
<body>
<div class="shell">
  <h2>শিখো — চ্যাট</h2>

  <div class="setup">
    <div class="rowsel">
      <select id="classSelect">
        <option value="6">Class 6</option>
        <option value="7">Class 7</option>
        <option value="8">Class 8</option>
        <option value="9" selected>Class 9</option>
        <option value="10">Class 10</option>
      </select>
      <select id="subjectSelect">
        <option>Physics</option>
        <option>Chemistry</option>
        <option>Biology</option>
        <option>Math</option>
        <option>Bangla</option>
        <option>English</option>
        <option>ICT</option>
      </select>
    </div>
  </div>

  <div class="chat" id="chatBox">
    <div class="bubble ai">আসসালামু আলাইকুম! আমি তোমার SSC পড়াশোনার সাথী। ক্লাস আর সাবজেক্ট বেছে নিয়ে প্রশ্ন করো।</div>
  </div>

  <div class="composer">
    <input type="text" id="question" placeholder="তোমার প্রশ্ন লেখো..." onkeydown="if(event.key==='Enter')askAI()">
    <button onclick="askAI()">পাঠাও</button>
  </div>
</div>

<script>
async function askAI(){
  const question = document.getElementById('question').value.trim();
  const chatBox = document.getElementById('chatBox');
  if(!question) return;

  const userBubble = document.createElement('div');
  userBubble.className = 'bubble user';
  userBubble.textContent = question;
  chatBox.appendChild(userBubble);

  const loadingBubble = document.createElement('div');
  loadingBubble.className = 'bubble ai loading';
  loadingBubble.textContent = 'উত্তর তৈরি হচ্ছে...';
  chatBox.appendChild(loadingBubble);
  chatBox.scrollTop = chatBox.scrollHeight;
  document.getElementById('question').value = '';

  const cls = document.getElementById('classSelect').value;
  const subject = document.getElementById('subjectSelect').value;

  try{
    const res = await fetch('/.netlify/functions/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ question, cls, subject })
    });
    const data = await res.json();
    loadingBubble.classList.remove('loading');
    loadingBubble.textContent = data.error ? ("সমস্যা হয়েছে: " + data.error) : data.answer;
  }catch(err){
    loadingBubble.classList.remove('loading');
    loadingBubble.textContent = "নেটওয়ার্ক সমস্যা হয়েছে: " + err.message;
  }
  chatBox.scrollTop = chatBox.scrollHeight;
}
</script>
</body>
</html>
